experiment:
  name: town05_ckpt_stages
  output_root: results/paper_eval
  reference_method: stage_final

runtime:
  host: localhost
  port: 40002
  traffic_manager_port: 40007
  timeout: 600
  track: SENSORS
  repetitions: 1
  best_every: 0
  reuse_agent: 1
  carla_seed: 2000
  traffic_seed: 2000
  route_id_start: 0
  num_routes: 105
  route_passes: 1
  route_id_max: 331
  routes_dir: simulation/leaderboard/data/evaluation_routes
  routes_pattern: town05_short_r{}.xml
  routes_file: simulation/leaderboard/data/evaluation_routes/town05_short_r0.xml
  scenarios_file: simulation/leaderboard/data/scenarios/town05_all_scenarios_2.json
  scenario_parameter_file: simulation/leaderboard/leaderboard/scenarios/scenario_parameter_2.yaml
  team_agent: simulation/leaderboard/team_code/pnp_agent_e2e.py
  debug: 0
  resume: 0
  skip_existed: 0

methods:
  - name: stage_025k
    base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf.yaml
    overrides:
      rl:
        enabled: true
        eval_only: true
        deterministic_eval: true
        resume_path: results/rl_runs/run010/rl/checkpoints/ckpt_update_12.pt
      cbf:
        enabled: true

  - name: stage_050k
    base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf.yaml
    overrides:
      rl:
        enabled: true
        eval_only: true
        deterministic_eval: true
        resume_path: results/rl_runs/run010/rl/checkpoints/ckpt_update_25.pt
      cbf:
        enabled: true

  - name: stage_100k
    base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf.yaml
    overrides:
      rl:
        enabled: true
        eval_only: true
        deterministic_eval: true
        resume_path: results/rl_runs/run010/rl/checkpoints/ckpt_update_50.pt
      cbf:
        enabled: true

  - name: stage_final
    base_agent_config: simulation/leaderboard/team_code/agent_config/pnp_config_rl_cbf.yaml
    overrides:
      rl:
        enabled: true
        eval_only: true
        deterministic_eval: true
        resume_path: results/rl_runs/run010/rl/checkpoints/ckpt_best.pt
      cbf:
        enabled: true
