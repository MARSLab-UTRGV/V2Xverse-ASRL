control:
    turn_KP: 1.0
    turn_KI: 0.2
    turn_KD: 0.1
    turn_n: 5  # buffer size

    speed_KP: 5.0
    speed_KI: 1
    speed_KD: 0.1
    speed_n: 20  # buffer size

    max_throttle: 0.75             # upper limit on throttle signal value in dataset
    brake_speed: 0.1               # desired speed below which brake is triggered
    brake_ratio: 1.1               # ratio of speed to desired speed at which brake is triggered
    clip_delta: 0.35               # maximum change in speed input to logitudinal controller

    max_speed: 10                   # the max speed of ego vehicle
    collision_buffer: [2.5, 1.2]   # safe distance in vertical and horizontal
    momentum: 0                    #
    target_point_distance: 10      # distance from ego vehicle to the target point generated by global navigation planner
    detect_threshold: &det_thre  0.04
    lateral_controller: "pid"      # one of: pid, pure_pursuit

    # pure pursuit lateral parameters (used only when lateral_controller=pure_pursuit)
    pp_wheelbase_m: 2.8
    pp_max_steer_angle_rad: 1.22
    pp_lookahead_min_m: 1.4
    pp_lookahead_gain_s: 0.9
    pp_lookahead_max_m: 5.0
    pp_interp_step_m: 0.25
    pp_steer_gain: 0.68
    pp_steer_sign: 1.0
    pp_low_speed_steer_zero_mps: 0.01

# rsu config
RSU:
    change_rsu_frame: 5            # frame gap before a new rsu is spawned
    rsu_height: 7.5                # height of rsu
    rsu_lane_side: 'right'         # location of rsu, on the right/left side of the lane
    rsu_distance: 12               # horizontal distance from rsu to ego vehicle, positive value means foward direction

simulation:
    ego_num: 1                     # number of communicating drivable ego vehicles
    skip_frames: 4                 # frame gap before a new driving control signal is generated
    save_step_outputs: true        # save per-step dashboard jpg/json (disable for faster training)

perception:
    core_method: 'collaborative_perception'
    detect_threshold: *det_thre        #
    detection_range: [36, 12, 12, 12] # front rear left right
    # perception model directory, including model checkpoint and config file
    perception_model_dir: 'checkpoints/codriving/perception'

planning:
    core_method: 'MotionNet'
    planner_config: "codriving/hypes_yaml/codriving/end2end_codriving.yaml"
    # planner model checkpoint
    planner_model_checkpoint: 'checkpoints/codriving/planner/codriving_planner.ckpt'

cbf:  # Control Barrier Function (CBF) filter configuration
    enabled: true            # Enable/disable CBF safety filter
    debug: true              # Enable extra CBF debug output (if implemented)
    max_distance: 30.0       # Max distance (m) to consider nearby actors in CBF constraints
    margin: 2.5              # Safety margin (m) added to collision radius
    a_brake: 6.0             # Assumed max braking decel (m/s^2) for barrier formula
    a_min: -8.0              # Minimum longitudinal accel allowed by QP (m/s^2)
    a_max: 4.0               # Maximum longitudinal accel allowed by QP (m/s^2)
    slack_weight: 1000.0    # QP slack penalty weight (higher = stricter constraints)
    gamma_vehicle: 0.9       # Barrier gain for vehicles (if RL disabled)
    gamma_ped: 0.9           # Barrier gain for pedestrians (if RL disabled)
    gamma_bike: 0.9         # Barrier gain for bicycles (if RL disabled)
    dt: 0.2                  # Time step (s) for CBF prediction horizon
    actor_path_gating: true  # Filter actors outside ego forward-path corridor
    gate_rear_distance: 2.0  # Ignore actors this far behind ego (m)
    gate_lateral_distance: 2.5  # Base lateral corridor half-width (m)
    gate_lateral_speed_gain: 0.04  # Corridor widening with ego speed (m per m/s)
    gate_enable_crossing: true  # Keep far-lateral actors that can cross into ego path
    gate_crossing_ttc: 3.2   # Keep crossers only if lateral TTC is within this horizon (s)
    gate_crossing_forward: 16.0  # Crossing check forward window in ego frame (m)
    gate_crossing_rear: 2.0  # Crossing check rear window in ego frame (m)

rl:  # Reinforcement Learning (RL) configuration for adaptive gammas
    enabled: false                 # Enable/disable RL policy for gamma actions
    obs_dim: 11                   # Observation dimension (must match RL obs builder)
    action_dim: 3                 # Action dimension (gamma_vehicle, gamma_ped, gamma_bike)
    n_steps: 2000               # Steps per on-policy update (buffer size)
    log_dir: "rl_runs/run_001"     # Directory to write CSV logs + checkpoints
    save_every: 1                 # Save checkpoint every N updates
    resume_path: null             # Path to checkpoint to resume (null = start fresh)
    eval_only: false              # true = freeze RL learning and only infer gammas from loaded checkpoint
    deterministic_eval: true      # when eval_only=true, use deterministic policy action
    learning_rate: 3.0e-4         # Adam learning rate
    gamma: 0.99                   # Discount factor for rewards/costs
    gae_lambda: 0.95              # GAE lambda for reward advantage estimation
    clip_coef: 0.2                # PPO clip epsilon
    update_epochs: 10             # PPO epochs per update
    num_minibatches: 8            # PPO minibatches per update
    ent_coef: 0.005               # Entropy bonus coefficient
    vf_coef: 0.5                  # Value loss coefficient
    max_grad_norm: 0.5            # Gradient clipping norm
    cost_limit: 0.1               # Target average episodic cost for constraint
    lagrange_mult: 1.0            # Initial Lagrange multiplier (lambda)
    lagrange_mult_max: 100.0      # Max Lagrange multiplier
    use_pid_lagrangian: true      # Use PID-style lambda update
    pid_gains: [1.0, 0.1, 0.1]    # PID gains (Kp, Ki, Kd)
    pid_ema_alpha: 0.9            # EMA smoothing for PID terms
    pid_d_delay: 1                # Delay steps for derivative term
    gamma_range: [0.05, 0.8]      # Action scaling range for gammas
    cost_distance: 2.5            # d_collision: inner collision threshold (m)
    cost_d_safe: 10.0             # d_safe: outer radius for dense proximity cost (m)
    cost_ttc_threshold: 3.0       # TTC horizon (s) for dense TTC risk cost
    cost_terminal_collision: 3.0  # Terminal cost at route end if collided
    cost_blend_mode: "max"        # Risk blend mode; only "max" is currently implemented
    cost_w_prox: 0.6              # Reserved for future weighted blend mode
    cost_w_ttc: 0.4               # Reserved for future weighted blend mode
    log_scale: 1000.0             # CSV readability scale only; does not affect training
